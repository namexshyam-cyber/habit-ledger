function clanMount(){
  if(!cloud.inited||!cloud.user||!cloud.profile)return;
  if(clan.state==='idle'){clanLoad();return;}
  if(clan.state!=='in')return;
  const l=$('#clanList');if(!l)return;
  l.textContent='';clan.msgs.forEach(function(m){l.appendChild(clanMsgNode(m));});
  l.scrollTop=l.scrollHeight;clanPaint();clanSelfTouch();
}
function clanCreate(f){
  const n=f.elements.n.value.trim().slice(0,24),d=f.elements.d.value.trim().slice(0,80);
  if(n.length<3)return clanMsg('Give your clan a name with at least 3 characters.');
  if(clan.busy)return;clan.busy=true;clanMsg('');
  const u=cloud.user,p=cloud.profile,D=fb.D,db=fb.db;
  const cid=D.push(D.ref(db,'clans')).key;
  let code='',tries=0;
  function pick(){
    code=genCode();
    return D.get(D.ref(db,'clanCodes/'+code)).then(function(sn){if(sn.exists()&&++tries<6)return pick();});
  }
  pick().then(function(){
    const info={name:n,adult:!!p.adult,owner:u.uid,code:code,createdAt:Date.now()};if(d)info.desc=d;
    return D.set(D.ref(db,'clans/'+cid),info);
  }).then(function(){return D.set(D.ref(db,'clanMembers/'+cid+'/'+u.uid),memberRecord(code));})
  .then(function(){return D.set(D.ref(db,'clanCodes/'+code),cid);})
  .then(function(){return D.set(D.ref(db,'userClan/'+u.uid),cid);})
  .then(function(){clanReset();return clanAttach(cid);})
  .catch(function(e){
    const up={};up['clans/'+cid]=null;up['clanMembers/'+cid]=null;
    D.update(D.ref(db),up).catch(function(){});
    clanMsg(isPerm(e)?'Could not create the clan. The database rules may need updating.':'Could not create the clan. Please try again.');
  }).then(function(){clan.busy=false;});
}
function clanJoinCode(f){
  const code=f.elements.c.value.replace(/\s/g,'').toUpperCase();
  if(code.length!==6)return clanMsg('Invite codes have 6 letters and numbers.');
  if(clan.busy)return;clan.busy=true;clanMsg('');
  const u=cloud.user,D=fb.D,db=fb.db;
  D.get(D.ref(db,'clanCodes/'+code)).then(function(sn){
    const cid=sn.val();if(!cid)throw {code:'nocode'};
    return D.set(D.ref(db,'clanMembers/'+cid+'/'+u.uid),memberRecord(code))
      .then(function(){return D.set(D.ref(db,'userClan/'+u.uid),cid);})
      .then(function(){clanReset();return clanAttach(cid);});
  }).catch(function(e){
    clanMsg(e&&e.code==='nocode'?'No clan has that code.':(isPerm(e)?'Could not join. Check the code. A clan only accepts members from its own age group (18+ or under 18).':'Could not join. Please try again.'));
  }).then(function(){clan.busy=false;});
}
function clanSend(text){
  if(clan.state!=='in')return false;
  if(Date.now()-clan.last<1500){clanMsg('Slow down a little.');return false;}
  clan.last=Date.now();clanMsg('');
  fb.D.push(fb.D.ref(fb.db,'clanChat/'+clan.cid),{uid:cloud.user.uid,name:cloud.profile.name,text:text,ts:fb.D.serverTimestamp()}).catch(function(){clanMsg('Message could not be sent.');});
  return true;
}
function clanLeave(){
  if(!confirm('Leave this clan?'))return;
  const u=cloud.user,cid=clan.cid,D=fb.D,db=fb.db;
  D.remove(D.ref(db,'clanMembers/'+cid+'/'+u.uid)).then(function(){return D.remove(D.ref(db,'userClan/'+u.uid));})
   .then(function(){clanReset();clan.msg='You left the clan.';clanSet('none');})
   .catch(function(){clanMsg('Could not leave. Please try again.');});
}
function clanDelete(){
  if(!clan.info||clan.info.owner!==cloud.user.uid)return;
  if(!confirm('Delete this clan? All members will be removed and the clan chat will be erased. This cannot be undone.'))return;
  const cid=clan.cid,code=clan.info.code,u=cloud.user,D=fb.D,db=fb.db;
  const up={};up['clans/'+cid]=null;up['clanCodes/'+code]=null;up['clanMembers/'+cid]=null;up['clanChat/'+cid]=null;up['userClan/'+u.uid]=null;
  D.update(D.ref(db),up).then(function(){clanReset();clan.msg='Clan deleted.';clanSet('none');})
   .catch(function(){clanMsg('Could not delete the clan. Please try again.');});
}
function clanKick(mid){
  if(!clan.info||clan.info.owner!==cloud.user.uid||!mid||mid===cloud.user.uid)return;
  const mem=clan.members[mid]||{};
  if(!confirm('Remove '+(mem.name||'this member')+' from the clan?'))return;
  fb.D.remove(fb.D.ref(fb.db,'clanMembers/'+clan.cid+'/'+mid)).catch(function(){clanMsg('Could not remove that member.');});
}
document.addEventListener('submit',function(e){
  const f=e.target;
  if(f.id==='clanNew'){e.preventDefault();clanCreate(f);}
  else if(f.id==='clanJoin'){e.preventDefault();clanJoinCode(f);}
  else if(f.id==='clanForm'){
    e.preventDefault();const v=f.elements.t.value.trim().slice(0,300);if(!v)return;
    if(clanSend(v))f.elements.t.value='';
    f.elements.t.focus();
  }
});
document.addEventListener('click',function(e){
  const t=e.target.closest('[data-clan]');if(!t)return;
  const a=t.dataset.clan;
  if(a==='copy'){
    const code=(clan.info&&clan.info.code)||'';
    try{navigator.clipboard.writeText(code).then(function(){toast('Invite code copied');},function(){window.prompt('Copy this code',code);});}
    catch(x){window.prompt('Copy this code',code);}
  }
  else if(a==='leave')clanLeave();
  else if(a==='delete')clanDelete();
  else if(a==='kick')clanKick(t.dataset.uid);
  else if(a==='retry'){clanReset();render();}
});

/* ---------- feed (posts, likes, replies, report, block, moderation) ---------- */
const feed={state:'idle',group:'',posts:{},unsubs:[],blocked:{},open:{},last:0,lastReply:0,msg:''};
const REPORT_REASONS=['Spam','Bullying or hate','Inappropriate','Shares personal information','Other'];
function feedGroup(){return cloud.profile&&cloud.profile.adult?'adult':'minor';}
function ago(ts){
  const d=Math.max(0,Date.now()-(+ts||0));
  if(d<60000)return 'now';
  if(d<3600000)return Math.floor(d/60000)+'m';
  if(d<86400000)return Math.floor(d/3600000)+'h';
  const t=new Date(+ts);return t.getDate()+'/'+(t.getMonth()+1);
}
function riskyText(t){
  if(/https?:\/\/|www\./i.test(t))return 'Links are not allowed.';
  if(/[^\s@]+@[^\s@]+\.[^\s@]+/.test(t))return 'Please do not share email addresses.';
  if(/(\+?\d[\s().\-]{0,2}){9,}/.test(t))return 'Please do not share phone numbers.';
  return '';
}
function feedMsg(t){feed.msg=t||'';const e=$('#feedMsg');if(e)e.textContent=feed.msg;}
function feedReset(){
  feed.unsubs.forEach(function(u){try{u();}catch(e){}});
  feed.unsubs=[];feed.state='idle';feed.posts={};feed.blocked={};feed.group='';
}
function feedSet(st){feed.state=st;if(ui.tab==='feed')render();}
function feedLoad(){
  if(feed.state!=='idle'||!cloud.user||!cloud.profile||!fb.db)return;
  feed.state='loading';feed.group=feedGroup();
  const g=feed.group,uid=cloud.user.uid,D=fb.D,db=fb.db;
  D.get(D.ref(db,'blocks/'+uid)).then(function(sn){feed.blocked=sn.val()||{};},function(){feed.blocked={};}).then(function(){
    const q=D.query(D.ref(db,'feed/'+g),D.limitToLast(40));
    const bad=function(){feed.unsubs.forEach(function(u){try{u();}catch(e){}});feed.unsubs=[];feedSet('error');};
    const u1=D.onChildAdded(q,function(sn){feedPut(sn.key,sn.val());},bad);
    const u2=D.onChildChanged(q,function(sn){feedPut(sn.key,sn.val());},function(){});
    const u3=D.onChildRemoved(q,function(sn){feedDrop(sn.key);},function(){});
    feed.unsubs=[u1,u2,u3];
    feedSet('ready');
  }).catch(function(){feedSet('error');});
}
function likeCount(p){return p&&p.likes?Object.keys(p.likes).length:0;}
function replyList(p){
  const r=p&&p.replies?p.replies:{};
  return Object.keys(r).sort().map(function(k){return Object.assign({id:k},r[k]);}).filter(function(x){return !feed.blocked[x.uid];});
}
function postActHtml(id,p){
  const uid=cloud.user.uid,liked=!!(p.likes&&p.likes[uid]);
  const mine=p.uid===uid,canDel=mine||cloud.admin;
  return '<button type="button" class="pbtn" data-feed="like" aria-pressed="'+liked+'" aria-label="Like">'+(liked?'\u2665':'\u2661')+' '+likeCount(p)+'</button>'
   +'<button type="button" class="pbtn" data-feed="reply" aria-label="Replies">\u{1F4AC} '+replyList(p).length+'</button>'
   +'<button type="button" class="pbtn" data-feed="menu" aria-label="More options">\u2026</button>'
   +'<div class="pmenu">'
   +(mine?'':'<button type="button" class="pbtn warn" data-feed="report">Report</button><button type="button" class="pbtn warn" data-feed="block">Block</button>')
   +(canDel?'<button type="button" class="pbtn warn" data-feed="del">Delete</button>':'')
   +'</div>';
}
function postRepHtml(id,p){
  const uid=cloud.user.uid,owner=p.uid===uid;
  return replyList(p).map(function(r){
    const canDel=r.uid===uid||owner||cloud.admin;
    return '<div class="rep" data-rid="'+esc(r.id)+'"><div class="mh">'+avatarHtml(r,20)+'<b>'+esc(r.name||'?')+'</b><span>'+ago(r.ts)+'</span></div><div class="mt">'+esc(r.text||'')+'</div>'
     +'<div class="pact">'+(r.uid!==uid?'<button type="button" class="pbtn warn" data-feed="rreport">Report</button>':'')+(canDel?'<button type="button" class="pbtn warn" data-feed="rdel">Delete</button>':'')+'</div></div>';
  }).join('');
}
function postHtml(id,p){
  const lv=LEVELS[Math.max(0,Math.min(LEVELS.length-1,+p.lvl||0))];
  return '<div class="ph">'+avatarHtml(p,32)+'<b>'+esc(p.name||'?')+'</b><span aria-hidden="true">'+lv.e+'</span><span class="pt">'+ago(p.ts)+'</span></div>'
   +'<p class="px">'+esc(p.text||'')+'</p>'
   +'<div class="pact">'+postActHtml(id,p)+'</div>'
   +'<div class="prep">'+postRepHtml(id,p)+'</div>'
   +'<form class="pform" data-pid="'+esc(id)+'" autocomplete="off"><input type="text" name="t" maxlength="200" placeholder="Write a reply" aria-label="Write a reply"><button class="btn primary" type="submit">Reply</button></form>';
}
function feedNode(id,p){
  const a=document.createElement('article');a.className='post'+(feed.open[id]?' open':'');a.dataset.pid=id;
  a.innerHTML=postHtml(id,p);return a;
}
function feedPut(id,val){
  if(!val||typeof val!=='object')return;
  feed.posts[id]=val;
  if(ui.tab!=='feed'||feed.state!=='ready')return;
  const l=$('#feedList');if(!l)return;
  let node=l.querySelector('[data-pid="'+id+'"]');
  if(feed.blocked[val.uid]){if(node)node.remove();return;}
  const empty=$('#feedEmpty');if(empty)empty.remove();
  if(node){
    const a=node.querySelector('.pact'),r=node.querySelector('.prep');
    if(a)a.innerHTML=postActHtml(id,val);
    if(r)r.innerHTML=postRepHtml(id,val);
    return;
  }
  node=feedNode(id,val);
  const kids=l.children;
  for(let i=0;i<kids.length;i++){if((kids[i].dataset.pid||'')<id){l.insertBefore(node,kids[i]);return;}}
  l.appendChild(node);
}
function feedDrop(id){
  delete feed.posts[id];delete feed.open[id];
  if(ui.tab!=='feed')return;
  const l=$('#feedList');if(!l)return;
  const n=l.querySelector('[data-pid="'+id+'"]');if(n)n.remove();
  feedEmptyCheck();
}
function feedEmptyCheck(){
  const l=$('#feedList');if(!l)return;
  if(!l.children.length&&!$('#feedEmpty'))l.innerHTML='<p class="muted" id="feedEmpty">No posts yet. Be the first to share a win, a tip or a question.</p>';
}
function feedBlockedHtml(){
  const ks=Object.keys(feed.blocked);
  if(!ks.length)return '';
  return '<details class="how"><summary>Blocked people ('+ks.length+')</summary>'
   +ks.map(function(k){return '<p>'+esc(feed.blocked[k]||'Someone')+' <button type="button" class="linkbtn" data-feed="unblock" data-uid="'+esc(k)+'">Unblock</button></p>';}).join('')+'</details>';
}
function viewFeed(){
  const msg=feed.msg;feed.msg='';
  let h='<section class="panel acct">';
  if(!cloud.inited){acctLoad();return h+'<h2 class="h2">Feed</h2><p class="muted">Loading\u2026</p></section>';}
  if(!cloud.user||!cloud.profile){
    return h+'<h2 class="h2">Feed</h2><p class="muted">Share wins, tips and questions with other people working on their habits. Sign in to read and post.</p>'
     +'<button class="btn primary" type="button" data-act="tab" data-tab="account">Sign in or create an account</button></section>';
  }
  if(feed.state==='idle'||feed.state==='loading')return h+'<h2 class="h2">Feed</h2><p class="muted">Loading posts\u2026</p></section>';
  if(feed.state==='error')return h+'<h2 class="h2">Feed</h2><p class="muted">Could not load the feed. Check your internet, or the database rules may need updating.</p><button class="btn" type="button" data-feed="retry">Try again</button></section>';
  h+='<h2 class="h2">Feed</h2><p class="muted chat-note">Only people in your age group ('+(cloud.profile.adult?'18+':'under 18')+') can see these posts. Be kind. No links, phone numbers or email addresses. You can report or block anyone.</p>'
   +'<form id="feedForm" class="acct-f" autocomplete="off"><textarea name="t" id="feedText" maxlength="280" rows="3" placeholder="Share a win, a tip or a question" aria-label="Write a post"></textarea>'
   +'<div class="fcount"><span id="feedCount">0</span>/280</div>'
   +'<p class="acct-msg" id="feedMsg" role="alert">'+esc(msg)+'</p><button class="btn primary" type="submit">Post</button></form></section>';
  if(cloud.admin)h+='<section class="panel acct"><h3 class="lbh">Moderation</h3><button type="button" class="btn" data-feed="mod">Show reports</button><div id="feedMod"></div></section>';
  h+='<div class="feedlist" id="feedList"></div><div id="feedBlocked">'+feedBlockedHtml()+'</div>';
  return h;
}
function feedMount(){
  if(!cloud.inited||!cloud.user||!cloud.profile)return;
  if(feed.state==='idle'){feedLoad();return;}
  if(feed.state!=='ready')return;
  const l=$('#feedList');if(!l)return;
  l.textContent='';
  Object.keys(feed.posts).sort().reverse().forEach(function(id){
    const p=feed.posts[id];if(!p||feed.blocked[p.uid])return;
    l.appendChild(feedNode(id,p));
  });
  feedEmptyCheck();
}
function feedPost(f){
  const t=f.elements.t.value.trim();if(!t)return;
  const bad=riskyText(t);if(bad)return feedMsg(bad);
  if(Date.now()-feed.last<20000)return feedMsg('Please wait a few seconds before posting again.');
  feed.last=Date.now();feedMsg('');
  const p=cloud.profile,L=levelInfo(xpTotal()),D=fb.D;
  D.push(D.ref(fb.db,'feed/'+feed.group),{uid:cloud.user.uid,name:p.name,color:safeColor(p.color),lvl:L.i,text:t,ts:D.serverTimestamp()}).then(function(){
    f.elements.t.value='';const c=$('#feedCount');if(c)c.textContent='0';
  }).catch(function(e){feed.last=0;feedMsg(isPerm(e)?'Could not post. The database rules may need updating, or your account is restricted.':'Could not post. Please try again.');});
}
function feedReply(f){
  const id=f.dataset.pid,t=f.elements.t.value.trim();if(!id||!t)return;
  const bad=riskyText(t);if(bad){toast(bad);return;}
  if(Date.now()-feed.lastReply<4000){toast('Please wait a moment before replying again.');return;}
  feed.lastReply=Date.now();
  const p=cloud.profile,D=fb.D;
  D.push(D.ref(fb.db,'feed/'+feed.group+'/'+id+'/replies'),{uid:cloud.user.uid,name:p.name,color:safeColor(p.color),text:t,ts:D.serverTimestamp()}).then(function(){
    f.elements.t.value='';
  }).catch(function(){feed.lastReply=0;toast('Could not send your reply.');});
}
function feedLike(id){
  const p=feed.posts[id];if(!p)return;
  const r=fb.D.ref(fb.db,'feed/'+feed.group+'/'+id+'/likes/'+cloud.user.uid);
  const w=(p.likes&&p.likes[cloud.user.uid])?fb.D.remove(r):fb.D.set(r,true);
  w.catch(function(){toast('Could not update your like.');});
}
function feedReport(id,rid){
  const ans=window.prompt('Report this '+(rid?'reply':'post')+'. Type a number:\n1 Spam\n2 Bullying or hate\n3 Inappropriate\n4 Shares personal information\n5 Other');
  const n=parseInt(ans,10);if(!(n>=1&&n<=5))return;
  const key=rid?id+'|'+rid:id;
  fb.D.set(fb.D.ref(fb.db,'reports/'+feed.group+'/'+key+'/'+cloud.user.uid),{ts:fb.D.serverTimestamp(),reason:REPORT_REASONS[n-1]})
    .then(function(){toast('Thanks. Your report was sent.');}).catch(function(){toast('Could not send the report.');});
}
function feedBlock(id){
  const p=feed.posts[id];if(!p||p.uid===cloud.user.uid)return;
  if(!confirm('Block '+(p.name||'this person')+'? You will no longer see their posts or replies.'))return;
  const target=p.uid,nm=String(p.name||'Someone').slice(0,20);
  fb.D.set(fb.D.ref(fb.db,'blocks/'+cloud.user.uid+'/'+target),nm).then(function(){
    feed.blocked[target]=nm;toast('Blocked '+nm);
    if(ui.tab==='feed'){feedMount();const b=$('#feedBlocked');if(b)b.innerHTML=feedBlockedHtml();}
  }).catch(function(){toast('Could not block that person.');});
}
function feedUnblock(uid){
  fb.D.remove(fb.D.ref(fb.db,'blocks/'+cloud.user.uid+'/'+uid)).then(function(){
    delete feed.blocked[uid];
    if(ui.tab==='feed'){feedMount();const b=$('#feedBlocked');if(b)b.innerHTML=feedBlockedHtml();}
  }).catch(function(){toast('Could not unblock.');});
}
function feedDelete(id){
  const p=feed.posts[id];if(!p)return;
  if(!confirm('Delete this post?'))return;
  fb.D.remove(fb.D.ref(fb.db,'feed/'+feed.group+'/'+id)).catch(function(){toast('Could not delete the post.');});
}
function feedReplyDelete(id,rid){
  if(!confirm('Delete this reply?'))return;
  fb.D.remove(fb.D.ref(fb.db,'feed/'+feed.group+'/'+id+'/replies/'+rid)).catch(function(){toast('Could not delete the reply.');});
}
/* moderation (site owner only) */
function modHtml(items){
  if(!items.length)return '<p class="muted">No open reports.</p>';
  return items.map(function(it,i){
    const t=it.target,reps=Object.keys(it.rep||{}).map(function(k){return (it.rep[k]||{}).reason||'';});
    return '<div class="modcard" data-i="'+i+'"><p class="muted chat-note">'+(it.g==='adult'?'18+':'Under 18')+' \u00b7 '+reps.length+' report'+(reps.length===1?'':'s')+': '+esc(reps.join(', '))+(it.rid?' \u00b7 reply':'')+'</p>'
     +(t?'<p><b>'+esc(t.name||'?')+'</b>: '+esc(t.text||'')+'</p>':'<p class="muted">Already deleted.</p>')
     +'<div class="row">'+(t?'<button type="button" class="btn danger" data-feed="m-del">Delete</button><button type="button" class="btn danger" data-feed="m-ban">Delete and ban author</button>':'')
     +'<button type="button" class="btn" data-feed="m-dismiss">Dismiss</button></div></div>';
  }).join('');
}
function modLoad(){
  const box=$('#feedMod');if(!box)return;
  box.innerHTML='<p class="muted">Loading reports\u2026</p>';
  const D=fb.D,db=fb.db;
  D.get(D.ref(db,'reports')).then(function(sn){
    const all=sn.val()||{},jobs=[];
    Object.keys(all).forEach(function(g){Object.keys(all[g]||{}).forEach(function(key){
      const parts=key.split('|'),pid=parts[0],rid=parts[1]||'';
      const path='feed/'+g+'/'+pid+(rid?'/replies/'+rid:'');
      jobs.push(D.get(D.ref(db,path)).then(function(t){return{g:g,key:key,pid:pid,rid:rid,rep:all[g][key],path:path,target:t.exists()?t.val():null};},function(){return{g:g,key:key,pid:pid,rid:rid,rep:all[g][key],path:path,target:null};}));
    });});
    return Promise.all(jobs);
  }).then(function(items){feed.modItems=items;const b=$('#feedMod');if(b)b.innerHTML=modHtml(items);})
  .catch(function(){const b=$('#feedMod');if(b)b.innerHTML='<p class="muted">Could not load reports.</p>';});
}
function modAct(a,card){
  const it=(feed.modItems||[])[+card.dataset.i];if(!it)return;
  const D=fb.D,db=fb.db,up={};
  if(a==='m-del'||a==='m-ban')up[it.path]=null;
  if(a==='m-ban'&&it.target&&it.target.uid)up['bans/'+it.target.uid]=true;
  up['reports/'+it.g+'/'+it.key]=null;
  if(a==='m-ban'&&!confirm('Ban this user from posting and chatting?'))return;
  D.update(D.ref(db),up).then(function(){card.remove();toast('Done');}).catch(function(){toast('Could not complete that action.');});
}
document.addEventListener('submit',function(e){
  const f=e.target;
  if(f.id==='feedForm'){e.preventDefault();feedPost(f);}
  else if(f.classList&&f.classList.contains('pform')){e.preventDefault();feedReply(f);}
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='feedText'){const c=$('#feedCount');if(c)c.textContent=String(e.target.value.length);}
});
document.addEventListener('click',function(e){
  const t=e.target.closest('[data-feed]');if(!t)return;
  const a=t.dataset.feed,card=t.closest('.post');
  const id=card?card.dataset.pid:'';
  if(a==='like')feedLike(id);
  else if(a==='reply'){if(card){card.classList.toggle('open');feed.open[id]=card.classList.contains('open');}}
  else if(a==='menu'){if(card)card.classList.toggle('menu');}
  else if(a==='report')feedReport(id,'');
  else if(a==='rreport'){const r=t.closest('.rep');if(r)feedReport(id,r.dataset.rid);}
  else if(a==='block')feedBlock(id);
  else if(a==='del')feedDelete(id);
  else if(a==='rdel'){const r=t.closest('.rep');if(r)feedReplyDelete(id,r.dataset.rid);}
  else if(a==='unblock')feedUnblock(t.dataset.uid);
  else if(a==='retry'){feedReset();render();}
  else if(a==='mod')modLoad();
  else if(a==='m-del'||a==='m-ban'||a==='m-dismiss'){const c=t.closest('.modcard');if(c)modAct(a,c);}
});

const VIEWS={today:viewToday,month:viewMonth,weeks:viewWeeks,year:viewYear,todo:viewTodo,habits:viewHabits,chat:viewChat,account:viewAccount,clan:viewClan,feed:viewFeed};

/* ---------- render ---------- */
function paintChrome(){
  const b=$('#brand');if(b&&S)b.textContent=S.name;
  document.querySelectorAll('#tabs .tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===ui.tab)));
  const g=$('#gear');if(g)g.setAttribute('aria-pressed',String(ui.tab==='habits'));
  const f=$('#chatFab');if(f)f.hidden=(ui.tab==='chat'||ui.tab==='clan'||ui.tab==='account'||ui.tab==='feed');
  paintAcct();
}
function render(){
  const v=$('#view');if(!v)return;
  const keep={};
  v.querySelectorAll('[data-scrollkey]').forEach(e=>{keep[e.dataset.scrollkey]=e.scrollLeft;});
  v.innerHTML=S?VIEWS[ui.tab]():'<p class="skeleton">Loading your tracker</p>';
  v.querySelectorAll('[data-scrollkey]').forEach(e=>{if(keep[e.dataset.scrollkey]!=null&&!(ui.fresh&&S))e.scrollLeft=keep[e.dataset.scrollkey];});
  if(ui.fresh&&S){
    const sc=v.querySelector('[data-scrollkey="grid"]');
    if(sc){const th=sc.querySelector('th.today');sc.scrollLeft=th?Math.max(0,th.offsetLeft+th.offsetWidth-sc.clientWidth+24):0;}
    ui.fresh=false;
  }
  if(ui.focus){const el=v.querySelector('[data-fk="'+ui.focus+'"]');if(el&&!el.disabled)el.focus({preventScroll:true});ui.focus=null;}
  if(ui.focusSel){const el=$(ui.focusSel);if(el)el.focus({preventScroll:true});ui.focusSel=null;}
  paintChrome();
  levelCheck();
  if(ui.tab==='chat')chatMount();
  if(ui.tab==='clan')clanMount();
  if(ui.tab==='feed')feedMount();
}

/* ---------- actions ---------- */
const A={
  tab(t){ui.tab=t.dataset.tab;ui.fresh=true;ui.confirm=null;try{localStorage.setItem('habit-ledger-tab',ui.tab);}catch(e){}render();window.scrollTo(0,0);},
  gear(){if(ui.tab==='habits'){ui.tab=ui.prev||'today';}else{ui.prev=ui.tab;ui.tab='habits';}ui.confirm=null;render();window.scrollTo(0,0);},
  tick(t){const d=parseKey(t.dataset.date);if(d>today0)return;const id=t.dataset.h;setOn(id,d,!isOn(id,d));commit();},
  pickDay(t){ui.day=t.dataset.date;render();},
  mnav(t){let m=ui.cm+(+t.dataset.d),y=ui.cy;if(m<0){m=11;y--;}if(m>11){m=0;y++;}ui.cm=m;ui.cy=y;ui.fresh=true;render();},
  thisMonth(){ui.cy=today0.getFullYear();ui.cm=today0.getMonth();ui.fresh=true;render();},
  ynav(t){ui.year+=+t.dataset.d;render();},
  thisYear(){ui.year=today0.getFullYear();render();},
  goMonth(t){ui.cy=ui.year;ui.cm=+t.dataset.m;ui.tab='month';ui.fresh=true;render();window.scrollTo(0,0);},
  mstep(t){
    const h=hab(t.dataset.h);if(!h)return;const y=+t.dataset.y,m=+t.dataset.m,k=ymk(y,m);
    const L=S.counts[k]||(S.counts[k]={});L[h.id]=Math.max(0,(L[h.id]||0)+(+t.dataset.d));
    if(new Date(y,m+1,0)<parseKey(h.since))h.since=key(new Date(y,m,1));
    commit();
  },
  ttoggle(t){const x=S.todos.find(o=>o.id===t.dataset.id);if(x){x.done=!x.done;commit();}},
  tdel(t){S.todos=S.todos.filter(o=>o.id!==t.dataset.id);commit();},
  tclear(){const k=ymk(ui.cy,ui.cm);S.todos=S.todos.filter(o=>!(o.ym===k&&o.done));commit();},
  tcarry(){
    const k=ymk(ui.cy,ui.cm),nm=(ui.cm+1)%12,ny=ui.cm===11?ui.cy+1:ui.cy,nk=ymk(ny,nm);
    S.todos.filter(o=>o.ym===k&&!o.done&&!o.carried).forEach(o=>{o.carried=true;S.todos.push({id:uid(),text:o.text,done:false,ym:nk});});
    commit();
  },
  hgoal(t){const h=hab(t.dataset.h);if(!h)return;const max=h.kind==='weekly'?7:31;h.goal=Math.max(1,Math.min(max,(h.goal||1)+(+t.dataset.d)));commit();},
  arm(t){
    ui.confirm=t.dataset.id;clearTimeout(ui.ct);
    ui.ct=setTimeout(()=>{ui.confirm=null;render();},4000);render();
  },
  delHabit(t){
    const id=t.dataset.h;S.habits=S.habits.filter(h=>h.id!==id);
    Object.keys(S.log).forEach(k=>{delete S.log[k][id];});Object.keys(S.counts).forEach(k=>{delete S.counts[k][id];});
    ui.confirm=null;commit();
  },
  clearSample(){
    S.log={};S.counts={};S.todos=S.todos.filter(t=>!t.sample);S.sample=false;
    S.habits.forEach(h=>{h.since=key(today0);});ui.confirm=null;commit();
  },
  resetAll(){S=cleanState();ui.confirm=null;ui.tab='today';commit();}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  const fn=A[t.dataset.act];if(!fn)return;
  if(t.dataset.fk)ui.focus=t.dataset.fk;
  fn(t,e);
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.chg||!S)return;
  const h=t.dataset.h?hab(t.dataset.h):null;
  switch(t.dataset.chg){
    case 'hname':{const v=t.value.trim();if(h&&v){h.name=v.slice(0,60);commit();}else render();break;}
    case 'hkind':if(h){h.kind=t.value;if(h.kind==='weekly')h.goal=Math.min(7,h.goal||3);else if(h.kind==='monthly')h.goal=h.goal||2;commit();}break;
    case 'hslot':if(h){h.slot=t.value;commit();}break;
    case 'tname':{const v=t.value.trim();if(v){S.name=v.slice(0,40);commit();}else{t.value=S.name;}break;}
    case 'wstart':S.weekStart=+t.value;commit();break;
  }
});
document.addEventListener('submit',e=>{
  const f=e.target;if(!S)return;
  if(f.id==='addTodo'){
    e.preventDefault();const v=f.elements.text.value.trim();if(!v)return;
    S.todos.push({id:uid(),text:v.slice(0,120),done:false,ym:ymk(ui.cy,ui.cm)});ui.focusSel='#todoText';commit();
  }else if(f.id==='addHabit'){
    e.preventDefault();const v=f.elements.name.value.trim();if(!v)return;
    const kind=f.elements.kind.value;
    S.habits.push({id:uid(),name:v.slice(0,60),kind:kind,slot:'anytime',goal:kind==='weekly'?3:kind==='monthly'?2:0,since:key(today0)});
    ui.focusSel='#addHabit input[name="name"]';commit();
  }
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  const n=startOfDay(new Date());
  if(key(n)!==key(today0)){today0=n;ui.day=key(n);render();}
});

/* ---------- boot ---------- */
(async function boot(){
  render();
  try{await loadState();}catch(e){S=freshState();setStatus('local');}
  render();
  watch();
  try{if(localStorage.getItem(ACCT_FLAG)==='1')acctInit().then(function(){cloud.inited=true;paintAcct();}).catch(function(){});}catch(e){}
})();
})();
</script>
